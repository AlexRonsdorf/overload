  /* ----- Analytics ----- */
  function allExerciseNames(){
    var names = {}, order = [];
    var addName = function(n){
      var k = n.trim().toLowerCase();
      if (!k) return;
      if (!(k in names)){ names[k] = n.trim(); order.push(k); }
    };
    sortedSessions().forEach(function(s){ s.entries.forEach(function(e){ addName(e.name); }); });
    db.plans.forEach(function(p){ p.days.forEach(function(d){ d.exercises.forEach(function(e){ addName(e.name); }); }); });
    return order.map(function(k){ return names[k]; });
  }

  function exerciseHistory(name){
    var key = name.trim().toLowerCase();
    var pts = [];
    sortedSessions().reverse().forEach(function(s){
      s.entries.forEach(function(e){
        if (e.name.trim().toLowerCase() !== key || !e.sets.length) return;
        var top = 0, vol = 0;
        e.sets.forEach(function(st){ top = Math.max(top, st.w||0); vol += (st.w||0)*(st.r||0); });
        pts.push({ date:s.date, top:top, vol:vol, sets:e.sets, bw: !!e.bw || e.mode === 'bw' });
      });
    });
    // bodyweight exercises: chart reps instead of a flat 0-kg line
    var repsMode = pts.length > 0 && pts.every(function(p){ return p.bw || p.top === 0; });
    if (repsMode){
      pts.forEach(function(p){
        var m = 0;
        p.sets.forEach(function(st){ m = Math.max(m, st.r || 0); });
        p.top = m;
      });
    }
    // Rekord-Punkte (erstmals höher als alles davor) + Pausen vor diesem Workout
    var runMax = -1;
    pts.forEach(function(p, i){
      p.pr = i > 0 && p.top > runMax;
      runMax = Math.max(runMax, p.top);
      p.breaks = i > 0 ? breaksBetween(pts[i-1].date, p.date) : [];
    });
    return { pts: pts, repsMode: repsMode };
  }

  function niceTicks(min, max){
    if (min === max){ min = Math.max(0, min-5); max = max+5; }
    var span = max - min;
    var step = Math.pow(10, Math.floor(Math.log10(span/3)));
    var err = span / 3 / step;
    if (err >= 5) step *= 5; else if (err >= 2) step *= 2.5;
    var ticks = [];
    var t = Math.ceil(min/step)*step;
    while (t <= max + 1e-9){ ticks.push(Math.round(t*100)/100); t += step; }
    return ticks;
  }

  function chartSVG(pts){
    var W = 400, H = 210, padL = 40, padR = 18, padT = 18, padB = 26;
    var vals = pts.map(function(p){ return p.top; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var pad = Math.max(2.5, (max-min)*0.15);
    var y0 = Math.max(0, min - pad), y1 = max + pad;
    var ticks = niceTicks(y0, y1);
    var x = function(i){ return pts.length === 1 ? (padL + (W-padL-padR)/2) : padL + (W-padL-padR) * i/(pts.length-1); };
    var y = function(v){ return padT + (H-padT-padB) * (1 - (v-y0)/(y1-y0)); };

    var s = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Gewichtsverlauf">';
    // grid + y labels
    ticks.forEach(function(t){
      var ty = y(t);
      s += '<line x1="'+padL+'" y1="'+ty+'" x2="'+(W-padR)+'" y2="'+ty+'" stroke="var(--line)" stroke-width="1"/>' +
           '<text x="'+(padL-7)+'" y="'+(ty+3.5)+'" text-anchor="end" font-size="10" fill="var(--ink3)">'+fmtW(t)+'</text>';
    });
    // x labels: first + last date
    s += '<text x="'+padL+'" y="'+(H-8)+'" font-size="10" fill="var(--ink3)">'+fmtDM(pts[0].date)+'</text>';
    if (pts.length > 1){
      s += '<text x="'+(W-padR)+'" y="'+(H-8)+'" text-anchor="end" font-size="10" fill="var(--ink3)">'+fmtDM(pts[pts.length-1].date)+'</text>';
    }
    // Pausen zwischen zwei Workouts: gestrichelte Linie + Art der Pause
    pts.forEach(function(p,i){
      if (!i || !p.breaks || !p.breaks.length) return;
      var gx = (x(i-1) + x(i)) / 2;
      s += '<line x1="'+gx.toFixed(1)+'" y1="'+padT+'" x2="'+gx.toFixed(1)+'" y2="'+(H-padB)+'" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="3 3"/>' +
           '<text x="'+gx.toFixed(1)+'" y="'+(padT-6)+'" text-anchor="middle" font-size="9" font-weight="700" fill="var(--warn)">'+esc(breakKindLabel(p.breaks[0]))+'</text>';
    });
    // line
    if (pts.length > 1){
      var dPath = pts.map(function(p,i){ return (i?'L':'M') + x(i).toFixed(1) + ' ' + y(p.top).toFixed(1); }).join(' ');
      s += '<path d="'+dPath+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    }
    // points (+ big invisible hit targets); Rekorde leuchtend blau
    pts.forEach(function(p,i){
      var last = i === pts.length-1;
      var sel = chartTip === i;
      if (p.pr){
        s += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.top).toFixed(1)+'" r="9" fill="var(--pr)" opacity=".18"/>' +
             '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.top).toFixed(1)+'" r="'+(last||sel?5.5:4.5)+'" fill="var(--pr)" stroke="var(--surface)" stroke-width="1.5"/>';
      } else {
        s += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.top).toFixed(1)+'" r="'+(last||sel?5:3.5)+'" fill="'+(last||sel?'var(--accent)':'var(--surface)')+'" stroke="var(--accent)" stroke-width="2"/>';
      }
      s += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.top).toFixed(1)+'" r="14" fill="transparent" style="cursor:pointer" data-action="chart-tip" data-idx="'+i+'"/>';
    });
    // last value label
    var lp = pts[pts.length-1];
    var lx = x(pts.length-1), ly = y(lp.top);
    s += '<text x="'+Math.min(lx, W-padR-6).toFixed(1)+'" y="'+(ly-10).toFixed(1)+'" text-anchor="'+(lx > W-70 ? 'end' : 'middle')+'" font-size="12" font-weight="700" fill="'+(lp.pr ? 'var(--pr)' : 'var(--accent)')+'">'+fmtW(lp.top)+(lp.pr ? ' ★' : '')+'</text>';
    s += '</svg>';
    return s;
  }

  function rAnalytics(){
    var names = allExerciseNames();
    var h = '<div class="eyebrow">Progressive Overload</div><div class="bigdate">Fortschritt</div>';
    if (!names.length){
      return h + '<div class="empty">Lege zuerst einen Plan mit Übungen an.</div>';
    }
    if (!analyticsEx || names.indexOf(analyticsEx) === -1){
      // prefer an exercise that actually has history
      analyticsEx = names[0];
      for (var i=0;i<names.length;i++){
        if (exerciseHistory(names[i]).pts.length){ analyticsEx = names[i]; break; }
      }
    }
    h += '<div class="selectwrap" style="margin-top:14px"><select data-action="pick-ex" aria-label="Übung wählen">';
    names.forEach(function(n){
      h += '<option value="' + esc(n) + '"' + (n === analyticsEx ? ' selected' : '') + '>' + esc(n) + '</option>';
    });
    h += '</select></div>';

    var hist = exerciseHistory(analyticsEx);
    var pts = hist.pts;
    var unit = hist.repsMode ? ' Wdh.' : ' kg';
    if (!pts.length){
      h += '<div class="empty">Für „' + esc(analyticsEx) + '“ ist noch nichts getrackt.</div>';
      return h;
    }

    var first = pts[0].top, last = pts[pts.length-1].top, diff = Math.round((last-first)*100)/100;
    var st = exStats(analyticsEx);
    var best = hist.repsMode ? st.maxR : st.maxW;
    var lastIsPR = last >= best && pts[pts.length-1].pr;
    var toBest = Math.round((best - last) * 100) / 100;
    var u = '<span style="font-size:13px;color:var(--ink2)">' + unit + '</span>';
    h += '<div class="stattiles" style="grid-template-columns:1fr 1fr">' +
         '<div class="tile" style="border-color:var(--pr)"><div class="tiny">Rekord</div><div class="v num" style="color:var(--pr)">' + fmtW(best) + u + '</div>' +
           '<div class="tiny">' + (hist.repsMode ? esc(fmtDM(st.maxRDate)) : '× ' + st.maxWReps + ' · ' + esc(fmtDM(st.maxWDate))) + '</div></div>' +
         '<div class="tile"><div class="tiny">Aktuell</div><div class="v num' + (lastIsPR ? '" style="color:var(--pr)' : '') + '">' + fmtW(last) + u + '</div>' +
           '<div class="tiny">' + (lastIsPR ? 'neuer Rekord ★' : (toBest > 0 ? fmtW(toBest) + unit + ' bis zum Rekord' : 'auf Rekord-Niveau')) + '</div></div>' +
         '<div class="tile"><div class="tiny">Start</div><div class="v num">' + fmtW(first) + u + '</div><div class="tiny">' + esc(fmtDM(pts[0].date)) + '</div></div>' +
         '<div class="tile"><div class="tiny">Entwicklung</div><div class="v num' + (diff>0?' up':'') + '">' + (diff>0?'+':'') + fmtW(diff) + u + '</div><div class="tiny">' + pts.length + ' Workouts</div></div>' +
         '</div>';

    // Bestleistungen im Detail
    var nPR = pts.filter(function(p){ return p.pr; }).length;
    var allBreaks = pts.length > 1 ? breaksBetween(pts[0].date, todayISO()) : [];
    h += '<div class="eyebrow" style="margin-top:24px">Bestleistungen</div><div class="card">';
    if (!hist.repsMode){
      h += '<div class="recordrow"><span class="sub">Schwerstes Gewicht</span><span class="num" style="font-weight:700">' + fmtW(st.maxW) + ' kg × ' + st.maxWReps + ' <span class="tiny">' + esc(fmtDM(st.maxWDate)) + '</span></span></div>';
    }
    h += '<div class="recordrow"><span class="sub">Meiste Wiederholungen</span><span class="num" style="font-weight:700">' + st.maxR + (hist.repsMode ? ' Wdh.' : ' × ' + fmtW(st.maxRW) + ' kg') + ' <span class="tiny">' + esc(fmtDM(st.maxRDate)) + '</span></span></div>' +
         '<div class="recordrow"><span class="sub">Rekorde gebrochen</span><span class="num" style="font-weight:700">' + nPR + '×</span></div>' +
         '<div class="recordrow"><span class="sub">Pausen seit Start</span><span class="num" style="font-weight:700">' + allBreaks.length + (allBreaks.length ? ' <span class="tiny">' + esc(allBreaks.map(function(b){ return breakKindLabel(b) + ' ' + breakDur(b); }).join(', ')) + '</span>' : '') + '</span></div>' +
         '</div>';

    if (pts.length === 1){
      h += '<div class="card"><div class="sub">Erst ein Eintrag — ab dem zweiten Workout siehst du hier deine Kurve.</div></div>';
    } else {
      var tip = '';
      if (chartTip !== null && pts[chartTip]){
        tip = fmtDM(pts[chartTip].date) + ' — ' + fmtW(pts[chartTip].top) + unit + ' (' + fmtSets(pts[chartTip].sets) + ')';
      }
      h += '<div class="card chartbox"><div class="tiny" style="margin-bottom:4px">' + (hist.repsMode ? 'Meiste Wiederholungen pro Workout' : 'Schwerster Satz pro Workout (kg)') + '</div>' +
           chartSVG(pts) +
           '<div class="tipbox">' + esc(tip || 'Tippe einen Punkt für Details') + '</div></div>';
    }

    // history list (doubles as table view); Pausen chronologisch dazwischen
    h += '<div class="eyebrow" style="margin-top:24px">Alle Einträge</div>';
    pts.slice().reverse().forEach(function(p, ri){
      var prev = pts[pts.length - 2 - ri];
      var dropped = prev && p.top < prev.top;
      h += '<div class="card" style="padding:12px 14px;margin-top:8px' + (p.pr ? ';border-color:var(--pr)' : '') + '"><div class="row between">' +
           '<span class="sub">' + esc(fmtShort(p.date)) +
             (p.pr ? '<span class="badge pr">Rekord</span>' : '') +
             (dropped && p.breaks.length ? '<span class="badge warn">Wiedereinstieg</span>' : '') + '</span>' +
           '<span class="num" style="font-weight:700' + (p.pr ? ';color:var(--pr)' : '') + '">' + fmtW(p.top) + unit + '</span></div>' +
           '<div class="tiny num" style="margin-top:2px">' + esc(fmtSets(p.sets)) + '</div></div>';
      if (p.breaks && p.breaks.length){
        p.breaks.slice().reverse().forEach(function(b){
          h += '<div class="listitem breakitem" style="margin-top:8px;padding:9px 14px"><span><strong style="font-size:14px">' + esc(breakTitle(b)) + '</strong><br><span class="tiny">' + esc(breakLabel(b)) + '</span></span></div>';
        });
      }
    });
    return h;
  }

  /* ----- Kalender ----- */
  var MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  function rCalendar(){
    var now = new Date();
    var thisYear = now.getFullYear();
    if (!view.calYear) view.calYear = thisYear;
    var Y = view.calYear;
    var iso = todayISO();

    // Trainings je Tag (nur dieses Jahr)
    var byDay = {}, count = 0, days = 0;
    db.sessions.forEach(function(s){
      if (s.date.slice(0, 4) !== String(Y)) return;
      count++;
      if (!byDay[s.date]){ byDay[s.date] = s.id; days++; }
    });
    // Pausentage
    var brk = {};
    db.breaks.forEach(function(b){
      var d = parseISO(b.from), end = parseISO(b.to);
      for (; d <= end; d.setDate(d.getDate() + 1)){
        if (d.getFullYear() !== Y) continue;
        var k = Y + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        brk[k] = b.kind || 'other';
      }
    });
    var firstYear = thisYear;
    db.sessions.forEach(function(s){ firstYear = Math.min(firstYear, +s.date.slice(0, 4)); });

    var h = '<div class="calbar">' +
            '<div class="row">' +
              '<div class="calcount num">' + count + '<small>' + (count === 1 ? 'Training' : 'Trainings') + (days !== count ? ' · ' + days + ' Tage' : '') + '</small></div>' +
              '<div class="calyear">' +
                '<button class="iconbtn" data-action="cal-year" data-delta="-1"' + (Y <= firstYear ? ' disabled' : '') + ' aria-label="Vorheriges Jahr">‹</button>' +
                '<strong class="num">' + Y + '</strong>' +
                '<button class="iconbtn" data-action="cal-year" data-delta="1"' + (Y >= thisYear ? ' disabled' : '') + ' aria-label="Nächstes Jahr">›</button>' +
              '</div>' +
            '</div>' +
            '<div class="calwd">' + WD_LABELS.map(function(l){ return '<span>' + l + '</span>'; }).join('') + '</div>' +
            '</div>';

    for (var m = 0; m < 12; m++){
      var first = new Date(Y, m, 1);
      var offset = (first.getDay() + 6) % 7;   // Montag = 0
      var nDays = new Date(Y, m + 1, 0).getDate();
      var mCount = 0;
      for (var dd = 1; dd <= nDays; dd++){
        var k0 = Y + '-' + String(m+1).padStart(2,'0') + '-' + String(dd).padStart(2,'0');
        if (byDay[k0]) mCount++;
      }
      h += '<div class="calmonth" id="cal-m' + m + '"><div class="eyebrow"><span>' + MONTHS[m] + '</span><b class="num">' + (mCount ? mCount + '×' : '') + '</b></div><div class="calgrid">';
      for (var b0 = 0; b0 < offset; b0++) h += '<span class="calcell blank"></span>';
      for (var d0 = 1; d0 <= nDays; d0++){
        var k = Y + '-' + String(m+1).padStart(2,'0') + '-' + String(d0).padStart(2,'0');
        var cls = 'calcell';
        if (byDay[k]) cls += ' on';
        else if (brk[k]) cls += ' brk';
        if (k === iso) cls += ' today';
        else if (k > iso) cls += ' future';
        if (byDay[k]){
          h += '<button class="' + cls + '" data-action="open-session" data-id="' + byDay[k] + '" aria-label="Training am ' + esc(fmtShort(k)) + '">' + d0 + '</button>';
        } else {
          h += '<span class="' + cls + '">' + d0 + '</span>';
        }
      }
      h += '</div></div>';
    }
    h += '<div class="callegend"><span class="l-on">Training</span><span class="l-brk">Pause / krank</span></div>';
    return h;
  }

  /* ---------- Export / Import ---------- */
  function exportData(){
    var blob = new Blob([JSON.stringify(db, null, 2)], { type:'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'overload-backup-' + todayISO() + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('Backup erstellt');
  }
  function importData(file){
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.plans) || !Array.isArray(data.sessions)) throw new Error('bad');
        db = data;
        save();
        confirmArm = null;
        view = { name:'home' };
        render();
        toast('Backup eingespielt ✓');
      } catch(e){
        toast('Datei konnte nicht gelesen werden');
      }
    };
    reader.readAsText(file);
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', function(ev){
    var el = ev.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');
    var d = db.draft;

    // two-step confirm buttons: first tap arms, second tap executes
    var confirmKey = el.getAttribute('data-confirm');
    if (confirmKey && confirmArm !== confirmKey){
      confirmArm = confirmKey;
      view._keepScroll = true;
      render();
      return;
    }
    confirmArm = null; // any other action disarms

    switch(action){
      case 'nav':
        view = { name: el.getAttribute('data-view') };
        render(); break;
      case 'start':
        startDraft(el.getAttribute('data-day')); break;
      case 'resume':
        view = { name:'track' }; render(); break;
      case 'open-session':
        view = { name:'session', id: el.getAttribute('data-id'), from: view.name === 'calendar' ? { name:'calendar', calYear:view.calYear } : null }; render(); break;
      case 'back-session':
        view = view.from || { name:'home' }; render(); break;
      case 'toggle-break-form':
        view.addBreak = !view.addBreak;
        view.breakKind = 'sick'; view.brFrom = view.brTo = view.brNote = null;
        view._keepScroll = true; render(); break;
      case 'break-kind':
        view.breakKind = el.getAttribute('data-value');
        view.brFrom = document.getElementById('brFrom').value;
        view.brTo = document.getElementById('brTo').value;
        view.brNote = document.getElementById('brNote').value;
        view._keepScroll = true; render(); break;
      case 'save-break': {
        var bFrom = document.getElementById('brFrom').value;
        var bTo = document.getElementById('brTo').value;
        var bNote = (document.getElementById('brNote').value || '').trim();
        if (!bFrom || !bTo){ toast('Bitte beide Daten wählen'); break; }
        if (bTo < bFrom){ var tmpB = bFrom; bFrom = bTo; bTo = tmpB; }
        var bKind = view.breakKind || 'sick';
        db.breaks.push({ id:uid(), from:bFrom, to:bTo, note:bNote, kind:bKind });
        save();
        view.addBreak = false;
        render(); toast(breakKindLabel({ kind:bKind }) + ' eingetragen ✓'); break;
      }
      case 'del-break':
        rememberForUndo();
        db.breaks = db.breaks.filter(function(b){ return b.id !== el.getAttribute('data-id'); });
        save(); view._keepScroll = true; render(); toast('Pause gelöscht', true); break;
      case 'del-session':
        rememberForUndo();
        db.sessions = db.sessions.filter(function(s){ return s.id !== el.getAttribute('data-id'); });
        save(); view = { name:'home' }; render(); toast('Eintrag gelöscht', true); break;

      /* tracking */
      case 'w-inc': case 'w-dec': {
        var e1 = d.entries[+el.getAttribute('data-ex')], s1 = e1.sets[+el.getAttribute('data-set')];
        var cur = s1.w === null ? 0 : s1.w;
        s1.w = Math.max(0, Math.round((cur + (action==='w-inc'?1:-1))*100)/100);
        e1.touched = true;
        save(); updateWBtn(el, e1, +el.getAttribute('data-set'), s1.w); break;
      }
      case 'r-inc': case 'r-dec': {
        var e2 = d.entries[+el.getAttribute('data-ex')], s2 = e2.sets[+el.getAttribute('data-set')];
        var cr = s2.r === null ? 0 : s2.r;
        s2.r = Math.max(0, cr + (action==='r-inc'?1:-1));
        e2.touched = true;
        save(); updateValBtn(el, e2, +el.getAttribute('data-set'), 'r', s2.r); break;
      }
      case 'add-set': {
        var e3 = d.entries[+el.getAttribute('data-ex')];
        var lastSet = e3.sets[e3.sets.length-1];
        e3.sets.push(lastSet ? { w:lastSet.w, r:lastSet.r } : { w:null, r:null });
        e3.touched = true;
        save(); view._keepScroll = true; render(); break;
      }
      case 'rem-set': {
        var e4 = d.entries[+el.getAttribute('data-ex')];
        if (e4.sets.length > 1) e4.sets.pop();
        e4.touched = true;
        save(); view._keepScroll = true; render(); break;
      }
      case 'skip': {
        var eS = d.entries[+el.getAttribute('data-ex')];
        eS.skipped = true; eS.done = false;
        save(); view._keepScroll = true; render(); toast(eS.name + ' übersprungen'); break;
      }
      case 'unskip': {
        var eU = d.entries[+el.getAttribute('data-ex')];
        eU.skipped = false;
        save(); view._keepScroll = true; render(); break;
      }
      case 'add-note': {
        var eN = d.entries[+el.getAttribute('data-ex')];
        if (eN.note === null || eN.note === undefined) eN.note = '';
        save(); view._keepScroll = true; render();
        var ta = document.querySelector('textarea[data-ex="' + el.getAttribute('data-ex') + '"]');
        if (ta) ta.focus();
        break;
      }
      case 'toggle-done': {
        var e5 = d.entries[+el.getAttribute('data-ex')];
        e5.done = !e5.done;
        save();
        view._keepScroll = true; render(); break;   // kein Timer beim Abhaken der Übung
      }
      case 'set-check': {
        var e6 = d.entries[+el.getAttribute('data-ex')];
        var rsi = +el.getAttribute('data-set');
        var s6 = e6.sets[rsi];
        s6.done = !s6.done;
        e6.touched = true;
        // Übung gilt als erledigt, sobald alle Sätze abgehakt sind
        e6.done = e6.sets.every(function(st){ return st.done; });
        save();
        var isPR = s6.done && setIsPR(e6, rsi);
        if (s6.done) startRest(entryRestForSet(e6, rsi), e6.name + ' · Satz ' + (rsi + 1));  // großer Timer
        view._keepScroll = true; render();
        if (isPR){
          var bwPR = e6.mode === 'bw' || (e6.bw && e6.mode !== 'bwplus');
          toast('Neuer Rekord ★ ' + e6.name + ' · ' + (bwPR ? (s6.r || 0) + ' Wdh.' : fmtW(s6.w || 0) + ' kg × ' + (s6.r || 0)));
        }
        break;
      }
      case 'pick': {
        var field = el.getAttribute('data-field');
        if (field === 'w' || field === 'r'){
          var pe = d.entries[+el.getAttribute('data-ex')];
          var ps = pe.sets[+el.getAttribute('data-set')];
          var isW = field === 'w';
          var curV = isW ? ps.w : ps.r;
          openPicker(
            pe.name + ' · Satz ' + (+el.getAttribute('data-set') + 1) + (isW ? ' · Gewicht' : ' · Wiederholungen'),
            isW ? rangeVals(0, 300, 0.5, true, curV) : rangeVals(0, 50, 1, true, curV),
            curV, isW ? 'kg' : 'Wdh.',
            function(value){
              if (isW) ps.w = value; else ps.r = (value === null ? null : Math.round(value));
              pe.touched = true;
              save();
              updateValBtn(el, pe, +el.getAttribute('data-set'), field, isW ? value : (value === null ? null : Math.round(value)));
            },
            null, { type: isW ? 'weight' : 'reps' }
          );
        } else {
          var pdDay = findDay(findPlan(view.planId), view.dayId);
          if (!pdDay) break;
          var pex = pdDay.exercises[+el.getAttribute('data-ex')];
          if (field === 'ex-sets'){
            openPicker(pex.name + ' · Ziel-Sätze', rangeVals(1, 10, 1, false, null), pex.sets, 'Sätze',
              function(value){
                pex.sets = value;
                save(); view._keepScroll = true; render();
              });
          } else if (field === 'ex-reps'){
            openPicker(pex.name + ' · Wiederholungen (von)', rangeVals(1, 50, 1, false, null), pex.reps, 'Wdh.',
              function(value){
                pex.reps = value;
                if (pex.repsMax != null && pex.repsMax <= value) pex.repsMax = null; // range collapsed
                save(); view._keepScroll = true; render();
              });
          } else if (field === 'ex-rest'){
            var rsi = +el.getAttribute('data-set');
            openPicker(pex.name + ' · Pause nach Satz ' + (rsi + 1),
              [0,15,30,45,60,75,90,105,120,135,150,180,210,240,300], restForSet(pex, rsi), '',
              function(value){
                if (!pex.rests) pex.rests = [];
                while (pex.rests.length < pex.sets){ pex.rests.push(restForSet(pex, pex.rests.length)); }
                pex.rests[rsi] = value;
                save(); view._keepScroll = true; render();
              },
              function(v){ return v === 0 ? 'aus' : fmtTime(v); });
          } else if (field === 'ex-reps-max'){
            openPicker(pex.name + ' · Wiederholungen (bis)', rangeVals(pex.reps + 1, 50, 1, true, pex.repsMax != null ? pex.repsMax : null), pex.repsMax != null ? pex.repsMax : null, 'Wdh.',
              function(value){
                pex.repsMax = value;
                save(); view._keepScroll = true; render();
              });
          }
        }
        break;
      }
      case 'finish': finishWorkout(); break;
      case 'discard':
        rememberForUndo();
        db.draft = null; stopRest(); save(); view = { name:'home' }; render(); toast('Workout verworfen', true); break;

      /* plans */
      case 'open-plan':
        view = { name:'planEdit', planId: el.getAttribute('data-id') }; render(); break;
      case 'add-plan': {
        var np = { id:uid(), name:'Neuer Plan', days:[] };
        db.plans.push(np); save();
        view = { name:'planEdit', planId:np.id }; render(); break;
      }
      case 'activate-plan':
        db.activePlanId = el.getAttribute('data-id'); save();
        view._keepScroll = true; render(); toast('Plan aktiviert'); break;
      case 'del-plan': {
        rememberForUndo();
        var pid = el.getAttribute('data-id');
        db.plans = db.plans.filter(function(p){ return p.id !== pid; });
        if (db.activePlanId === pid) db.activePlanId = db.plans.length ? db.plans[0].id : null;
        if (db.draft && db.draft.planId === pid) db.draft = null;
        save(); view = { name:'plans' }; render(); toast('Plan gelöscht', true); break;
      }
      case 'add-day': {
        var p2 = findPlan(view.planId);
        var ndDay = { id:uid(), name:'Neuer Tag', weekdays:[], exercises:[] };
        p2.days.push(ndDay); save();
        view = { name:'dayEdit', planId:p2.id, dayId:ndDay.id }; render(); break;
      }
      case 'open-day':
        view = { name:'dayEdit', planId:view.planId, dayId: el.getAttribute('data-id') }; render(); break;
      case 'del-day': {
        rememberForUndo();
        var p3 = findPlan(view.planId);
        p3.days = p3.days.filter(function(x){ return x.id !== view.dayId; });
        save(); view = { name:'planEdit', planId:p3.id }; render(); toast('Trainingstag entfernt', true); break;
      }
      case 'toggle-wd': {
        var p4 = findPlan(view.planId), d4 = findDay(p4, view.dayId);
        var wd = +el.getAttribute('data-wd');
        var ix = d4.weekdays.indexOf(wd);
        if (ix === -1) d4.weekdays.push(wd); else d4.weekdays.splice(ix,1);
        save(); view._keepScroll = true; render(); break;
      }
      case 'ex-add': {
        var p5 = findPlan(view.planId), d5 = findDay(p5, view.dayId);
        var inp = document.getElementById('newExName');
        var nm = (inp.value || '').trim();
        if (!nm){ inp.focus(); return; }
        d5.exercises.push({ id:uid(), name:nm, sets:3, reps:10 });
        save(); view._keepScroll = true; render(); break;
      }
      case 'ex-set-mode': {
        var dBW = findDay(findPlan(view.planId), view.dayId);
        var exBW = dBW.exercises[+el.getAttribute('data-ex')];
        exBW.mode = el.getAttribute('data-mode');
        exBW.bw = exBW.mode === 'bw';
        save(); view._keepScroll = true; render(); break;
      }
      case 'ex-del': {
        rememberForUndo();
        var p6 = findPlan(view.planId), d6 = findDay(p6, view.dayId);
        var removed = d6.exercises.splice(+el.getAttribute('data-ex'), 1);
        save(); view._keepScroll = true; render();
        toast((removed[0] ? removed[0].name : 'Übung') + ' entfernt', true); break;
      }
      case 'ex-up': case 'ex-down': {
        var p7 = findPlan(view.planId), d7 = findDay(p7, view.dayId);
        var i7 = +el.getAttribute('data-ex');
        var j7 = action === 'ex-up' ? i7-1 : i7+1;
        if (j7 < 0 || j7 >= d7.exercises.length) return;
        var tmp = d7.exercises[i7]; d7.exercises[i7] = d7.exercises[j7]; d7.exercises[j7] = tmp;
        save(); view._keepScroll = true; render(); break;
      }

      /* misc */
      case 'set-theme':
        db.settings.theme = el.getAttribute('data-value');
        save(); applySettings(); view._keepScroll = true; render(); break;
      case 'set-accent':
        db.settings.accent = el.getAttribute('data-value');
        save(); applySettings(); view._keepScroll = true; render(); break;
      case 'set-timermode':
        db.settings.timerMode = el.getAttribute('data-value');
        save(); if (db.rest) tickRest(); view._keepScroll = true; render(); break;
      case 'export': exportData(); break;
      case 'cal-year':
        view.calYear = (view.calYear || new Date().getFullYear()) + (+el.getAttribute('data-delta'));
        render(); break;
      case 'chart-tip':
        chartTip = (chartTip === +el.getAttribute('data-idx')) ? null : +el.getAttribute('data-idx');
        view._keepScroll = true; render(); break;
    }
  });

  document.addEventListener('change', function(ev){
    var el = ev.target;
    var action = el.getAttribute('data-action');
    if (action === 'switch-plan'){
      db.activePlanId = el.value; save(); render(); return;
    }
    if (action === 'pick-ex'){
      analyticsEx = el.value; chartTip = null; render(); return;
    }
    if (action === 'import'){
      var f = el.files && el.files[0];
      if (!f) return;
      if (confirmArm !== 'import'){
        confirmArm = 'import';
        view._keepScroll = true; render();
        return;
      }
      confirmArm = null;
      importData(f);
      return;
    }
  });

  document.addEventListener('input', function(ev){
    var el = ev.target;
    var field = el.getAttribute('data-field');
    if (!field) return;

    if (field === 'w' || field === 'r'){
      var e = db.draft && db.draft.entries[+el.getAttribute('data-ex')];
      if (!e) return;
      var s = e.sets[+el.getAttribute('data-set')];
      var v = parseNum(el.value);
      if (field === 'w') s.w = v; else s.r = (v === null ? null : Math.round(v));
      e.touched = true;
      save(); return;
    }
    if (field === 'ex-note'){
      var eNote = db.draft && db.draft.entries[+el.getAttribute('data-ex')];
      if (!eNote) return;
      eNote.note = el.value;
      el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px';   // mitwachsen
      save(); return;
    }
    if (field === 'brightness'){
      db.settings.brightness = +el.value;
      save(); applySettings();
      return;
    }
    if (field === 'plan-name'){
      var p = findPlan(view.planId);
      if (p){ p.name = el.value; save(); }
      return;
    }
    if (field === 'day-name'){
      var d2 = findDay(findPlan(view.planId), view.dayId);
      if (d2){ d2.name = el.value; save(); }
      return;
    }
    if (field === 'ex-name' || field === 'ex-sets' || field === 'ex-reps'){
      var d3 = findDay(findPlan(view.planId), view.dayId);
      if (!d3) return;
      var ex = d3.exercises[+el.getAttribute('data-ex')];
      if (!ex) return;
      if (field === 'ex-name') ex.name = el.value;
      if (field === 'ex-sets'){ var vs = parseNum(el.value); if (vs !== null && vs > 0) ex.sets = Math.round(vs); }
      if (field === 'ex-reps'){ var vr = parseNum(el.value); if (vr !== null && vr > 0) ex.reps = Math.round(vr); }
      save(); return;
    }
  });

  // applies theme choice and dimming; runs at start and on every change
  function applySettings(){
    var s = db.settings;
    if (s.theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', s.theme);
    document.documentElement.setAttribute('data-accent', s.accent);
    document.getElementById('dimmer').style.opacity = String((100 - s.brightness) / 100 * 0.7);
  }
  applySettings();
  render();

  // laufende Pause nach App-Neustart weiterlaufen lassen
  if (db.rest){
    tickRest();
    restTick = setInterval(tickRest, 250);
  }
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && db.rest) tickRest();
  });

  // iOS lässt fixierte Leisten nach der Bildschirmtastatur manchmal mitten auf der Seite "kleben":
  // nach jedem Verlassen eines Eingabefelds (und wenn die Tastatur zugeht) die Ansicht neu verankern.
  function reanchorBars(){
    window.scrollTo(window.scrollX, window.scrollY);
    var tb = document.getElementById('tabbar');
    tb.style.transform = 'translateZ(0) translateY(0.01px)';
    requestAnimationFrame(function(){ tb.style.transform = ''; });
  }
  document.addEventListener('focusout', function(ev){
    var t = ev.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')){
      setTimeout(reanchorBars, 60);
      setTimeout(reanchorBars, 350);
    }
  });
  if (window.visualViewport){
    var vvH = window.visualViewport.height;
    window.visualViewport.addEventListener('resize', function(){
      var h = window.visualViewport.height;
      if (h > vvH + 40) setTimeout(reanchorBars, 50);   // Tastatur zugegangen
      vvH = h;
    });
  }

  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* offline support unavailable */ });
  }
})();
</script>
</body>
</html>
